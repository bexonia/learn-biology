name: Build & Publish BEXONIA 3D Cell & Virus Explorer (ghcr.io/bexonia/learn-biology)

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: "Validate WebGL Assets & Build/Push OCI Image (ubuntu-latest)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate static WebGL pages, tours & SEO files
        run: |
          set -euo pipefail
          for f in \
            cell_explorer.html \
            eukaryotic_cell_3d.html \
            prokaryotic_cell_3d.html \
            dna_styles.html \
            animal_cell_realistic.html \
            plant_cell_realistic.html \
            fungal_cell_realistic.html \
            prokaryote_cell_realistic.html \
            molecules_preview.html \
            bacteriophage_realistic.html \
            hiv_realistic.html \
            coronavirus_realistic.html \
            adenovirus_realistic.html \
            tmv_realistic.html \
            robots.txt \
            sitemap.xml \
            nginx/default.conf; do
            if [ ! -s "$f" ]; then
              echo "ERROR: Required file '$f' is missing or empty!" >&2
              exit 1
            fi
          done
          echo "All static WebGL HTML pages and nginx config verified."

      - name: Build OCI container image & run local HTTP smoke test
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/bexonia/learn-biology"
          SHA_TAG="sha-${GITHUB_SHA::12}"

          docker build \
            -t "${IMAGE}:main" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${SHA_TAG}" \
            .

          docker run -d --name learn-smoke -p 8080:8080 "${IMAGE}:${SHA_TAG}"
          trap 'docker rm -f learn-smoke >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 15); do
            if curl -sf "http://127.0.0.1:8080/api/health" >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -sf "http://127.0.0.1:8080/api/health" | grep -q '"status":"ok"'
          curl -sf "http://127.0.0.1:8080/" | grep -q "3D Cell"
          curl -sf "http://127.0.0.1:8080/robots.txt" | grep -q "Sitemap:"
          curl -sf "http://127.0.0.1:8080/sitemap.xml" | grep -q "<urlset"
          echo "Smoke test passed (/api/health, /, /robots.txt, /sitemap.xml)."

      - name: Log in to GitHub Container Registry (ghcr.io)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push OCI image tags to ghcr.io/bexonia/learn-biology
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/bexonia/learn-biology"
          SHA_TAG="sha-${GITHUB_SHA::12}"

          docker push "${IMAGE}:${SHA_TAG}"
          docker push "${IMAGE}:main"
          docker push "${IMAGE}:latest"
          echo "Published ${IMAGE}:${SHA_TAG}, :main, and :latest."
