name: Build & Publish BEXONIA 3D Cell & Virus Explorer (ghcr.io/bexonia/learn-biology)

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch: {}

# Default workflow token is strictly read-only for all jobs (including all PRs)
permissions:
  contents: read

jobs:
  validate:
    name: "Validate WebGL Assets & Smoke-Test Container (Read-Only)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block external PR modifications to CI/CD pipeline & container config
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR_ASSOC: ${{ github.event.pull_request.author_association }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "${PR_HEAD_REPO}" != "bexonia/learn-biology" ] || { [ "${PR_AUTHOR_ASSOC}" != "OWNER" ] && [ "${PR_AUTHOR_ASSOC}" != "MEMBER" ] && [ "${PR_AUTHOR_ASSOC}" != "COLLABORATOR" ]; }; then
            CHANGED="$(git diff --name-only "origin/${BASE_REF:-main}...HEAD")"
            if echo "${CHANGED}" | grep -Eq '^(\.github/|Dockerfile$|nginx/)'; then
              echo "ERROR: External contributors are not permitted to modify CI/CD workflows (.github/), Dockerfile, or nginx/ configuration." >&2
              exit 1
            fi
          fi
          echo "PR pipeline integrity check passed."

      - name: Validate static WebGL pages, tours & SEO files
        run: |
          set -euo pipefail
          for f in \
            cell_explorer.html \
            eukaryotic_cell_3d.html \
            prokaryotic_cell_3d.html \
            dna_styles.html \
            animal_cell_realistic.html \
            plant_cell_realistic.html \
            fungal_cell_realistic.html \
            prokaryote_cell_realistic.html \
            molecules_preview.html \
            bacteriophage_realistic.html \
            hiv_realistic.html \
            coronavirus_realistic.html \
            adenovirus_realistic.html \
            tmv_realistic.html \
            robots.txt \
            sitemap.xml \
            nginx/default.conf; do
            if [ ! -s "$f" ]; then
              echo "ERROR: Required file '$f' is missing or empty!" >&2
              exit 1
            fi
          done
          echo "All static WebGL HTML pages and nginx config verified."

      - name: Build OCI container image & run local HTTP smoke test
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/bexonia/learn-biology"
          SHA_TAG="sha-${GITHUB_SHA::12}"

          docker build -t "${IMAGE}:${SHA_TAG}" .

          docker run -d --name learn-smoke -p 8080:8080 "${IMAGE}:${SHA_TAG}"
          trap 'docker rm -f learn-smoke >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 15); do
            if curl -sf "http://127.0.0.1:8080/api/health" >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -sf "http://127.0.0.1:8080/api/health" | grep -q '"status":"ok"'
          curl -sf "http://127.0.0.1:8080/" | grep -q "3D Cell"
          curl -sf "http://127.0.0.1:8080/dist/pages/cell_explorer.js" >/dev/null
          curl -sf "http://127.0.0.1:8080/robots.txt" | grep -q "Sitemap:"
          curl -sf "http://127.0.0.1:8080/sitemap.xml" | grep -q "<urlset"
          curl -sf -r 0-3 "http://127.0.0.1:8080/audio/en/v1/real-cell/ch0.intro.01.opus" | grep -q "OggS"
          curl -sf -r 0-3 "http://127.0.0.1:8080/audio/en/v2/real-cell/ch0.intro.01.opus" | grep -q "OggS"
          curl -sf -r 0-3 "http://127.0.0.1:8080/audio/en/v3/real-cell/ch0.intro.01.opus" | grep -q "OggS"
          curl -sf -r 0-3 "http://127.0.0.1:8080/audio/es/latam/real-cell/ch0.intro.01.opus" | grep -q "OggS"
          curl -sf -r 0-3 "http://127.0.0.1:8080/audio/es/spain/blueprint/real-cell/ch0.intro.01.opus" | grep -q "OggS"
          curl -sf -r 0-3 "http://127.0.0.1:8080/audio/es/spain/scientific/real-cell/ch0.intro.01.opus" | grep -q "OggS"
          curl -sf -r 0-3 "http://127.0.0.1:8080/audio/lenses/en/v3/story/mitochondrion.opus" | grep -q "OggS"
          curl -sf -r 0-3 "http://127.0.0.1:8080/audio/lenses/es/latam/story/mitochondrion.opus" | grep -q "OggS"
          curl -sf -r 0-3 "http://127.0.0.1:8080/audio/lenses/es/latam/blueprint/mitochondrion.opus" | grep -q "OggS"
          curl -sf -r 0-3 "http://127.0.0.1:8080/audio/lenses/es/latam/scientific/mitochondrion.opus" | grep -q "OggS"
          curl -sf -r 0-3 "http://127.0.0.1:8080/audio/lenses/es/spain/story/mitochondrion.opus" | grep -q "OggS"
          curl -sf -r 0-3 "http://127.0.0.1:8080/audio/lenses/es/spain/blueprint/mitochondrion.opus" | grep -q "OggS"
          curl -sf -r 0-3 "http://127.0.0.1:8080/audio/lenses/es/spain/scientific/mitochondrion.opus" | grep -q "OggS"
          echo "Smoke test passed (/api/health, /, /dist/pages/cell_explorer.js, /audio/*.opus, /robots.txt, /sitemap.xml)."

  publish:
    name: "Publish OCI Image & Release Bundle (main branch only)"
    needs: [validate]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'bexonia/learn-biology' &&
      github.repository_owner == 'bexonia'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Build verified OCI image & export release bundle
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/bexonia/learn-biology"
          SHA_TAG="sha-${GITHUB_SHA::12}"

          docker build \
            -t "${IMAGE}:main" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${SHA_TAG}" \
            .

          docker run -d --name learn-export "${IMAGE}:${SHA_TAG}"
          trap 'docker rm -f learn-export >/dev/null 2>&1 || true' EXIT

          mkdir -p dist
          docker exec learn-export tar -C /usr/share/nginx/html -czf - . > dist/learn-biology-web.tar.gz
          sha256sum dist/learn-biology-web.tar.gz | awk '{print $1}' > dist/SHA256SUMS

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push OCI image tags to ghcr.io/bexonia/learn-biology & publish latest release bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/bexonia/learn-biology"
          SHA_TAG="sha-${GITHUB_SHA::12}"

          docker push "${IMAGE}:${SHA_TAG}"
          docker push "${IMAGE}:main"
          docker push "${IMAGE}:latest"

          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              dist/learn-biology-web.tar.gz \
              dist/SHA256SUMS \
              --title "Latest Verified WebGL Build (main)" \
              --notes "Automated OCI build from commit ${GITHUB_SHA}."
          else
            gh release upload latest \
              dist/learn-biology-web.tar.gz \
              dist/SHA256SUMS \
              --clobber
          fi
          echo "Published ${IMAGE}:${SHA_TAG}, :main, :latest, and updated release 'latest'."
