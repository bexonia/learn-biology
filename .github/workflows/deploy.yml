name: Deploy BEXONIA 3D Cell & Virus Explorer (learn.bexonia.com)

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "screenshots/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy-learn:
    name: "Package WebGL Assets & Deploy to bexonia-learn (learn.bexonia.com)"
    runs-on: bexonia-infra-runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package & sync WebGL bundles to Kubernetes ConfigMaps
        run: |
          set -euo pipefail
          mkdir -p dist
          GZIP=-9 tar -czf dist/bundle-1.tar.gz \
            cell_explorer.html \
            eukaryotic_cell_3d.html \
            prokaryotic_cell_3d.html \
            dna_styles.html \
            robots.txt \
            sitemap.xml
          GZIP=-9 tar -czf dist/bundle-2.tar.gz \
            animal_cell_realistic.html \
            plant_cell_realistic.html \
            fungal_cell_realistic.html
          GZIP=-9 tar -czf dist/bundle-3.tar.gz \
            prokaryote_cell_realistic.html \
            molecules_preview.html \
            screenshots/*.jpg
          GZIP=-9 tar -czf dist/bundle-4.tar.gz \
            bacteriophage_realistic.html \
            hiv_realistic.html \
            coronavirus_realistic.html \
            adenovirus_realistic.html \
            tmv_realistic.html \
            tours/*.js

          BUNDLE_CHECKSUM=$(sha256sum dist/bundle-*.tar.gz | sha256sum | awk '{print $1}')
          echo "TF_VAR_bundle_checksum=${BUNDLE_CHECKSUM}" >> "$GITHUB_ENV"

          SA_JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          CA_CRT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          K8S_API="https://kubernetes.default.svc"

          # Ensure namespace bexonia-learn exists
          curl -sf --cacert "$CA_CRT" -H "Authorization: Bearer $SA_JWT" \
            "${K8S_API}/api/v1/namespaces/bexonia-learn" >/dev/null || \
          curl -sf --cacert "$CA_CRT" -H "Authorization: Bearer $SA_JWT" \
            -H "Content-Type: application/json" \
            -X POST "${K8S_API}/api/v1/namespaces" \
            -d '{"apiVersion":"v1","kind":"Namespace","metadata":{"name":"bexonia-learn","labels":{"app.kubernetes.io/part-of":"bexonia-platform","bexonia.io/zone":"learn"}}}' >/dev/null

          # Sync the 4 binary ConfigMaps directly (keeps OpenTofu logs clean and tfstate < 15 KB)
          for i in 1 2 3 4; do
            CM_NAME="bexonia-learn-bundle-${i}"
            FILE_KEY="bundle-${i}.tar.gz"
            jq -n --arg name "$CM_NAME" --arg key "$FILE_KEY" --rawfile b64 <(base64 -w0 "dist/${FILE_KEY}") \
              '{apiVersion:"v1",kind:"ConfigMap",metadata:{name:$name,namespace:"bexonia-learn"},binaryData:{($key):$b64}}' > "/tmp/${CM_NAME}.json"

            if curl -sf --cacert "$CA_CRT" -H "Authorization: Bearer $SA_JWT" \
              "${K8S_API}/api/v1/namespaces/bexonia-learn/configmaps/${CM_NAME}" >/dev/null; then
              curl -sf --cacert "$CA_CRT" -H "Authorization: Bearer $SA_JWT" \
                -H "Content-Type: application/json" \
                -X PUT "${K8S_API}/api/v1/namespaces/bexonia-learn/configmaps/${CM_NAME}" \
                -d @"/tmp/${CM_NAME}.json" >/dev/null
            else
              curl -sf --cacert "$CA_CRT" -H "Authorization: Bearer $SA_JWT" \
                -H "Content-Type: application/json" \
                -X POST "${K8S_API}/api/v1/namespaces/bexonia-learn/configmaps" \
                -d @"/tmp/${CM_NAME}.json" >/dev/null
            fi
            rm -f "/tmp/${CM_NAME}.json"
            echo "Synced ConfigMap/${CM_NAME}."
          done

          # If tfstate-default-bexonia-learn was not saved on an initial run, remove untracked K8s objects before apply
          if ! curl -sf --cacert "$CA_CRT" -H "Authorization: Bearer $SA_JWT" \
            "${K8S_API}/api/v1/namespaces/bexonia-runners/secrets/tfstate-default-bexonia-learn" >/dev/null; then
            echo "No existing tfstate-default-bexonia-learn found; cleaning untracked resources in bexonia-learn before apply..."
            curl -sf --cacert "$CA_CRT" -H "Authorization: Bearer $SA_JWT" -X DELETE "${K8S_API}/apis/apps/v1/namespaces/bexonia-learn/deployments/bexonia-learn" >/dev/null || true
            curl -sf --cacert "$CA_CRT" -H "Authorization: Bearer $SA_JWT" -X DELETE "${K8S_API}/api/v1/namespaces/bexonia-learn/services/bexonia-learn" >/dev/null || true
            curl -sf --cacert "$CA_CRT" -H "Authorization: Bearer $SA_JWT" -X DELETE "${K8S_API}/api/v1/namespaces/bexonia-learn/configmaps/bexonia-learn-nginx" >/dev/null || true
            curl -sf --cacert "$CA_CRT" -H "Authorization: Bearer $SA_JWT" -X DELETE "${K8S_API}/apis/traefik.io/v1alpha1/namespaces/bexonia-learn/ingressroutes/bexonia-learn-route" >/dev/null || true
          fi

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.8"
          tofu_wrapper: false

      - name: Authenticate to bexonia-vault via Kubernetes ServiceAccount
        run: |
          set -euo pipefail
          SA_JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          BAO_ADDR="http://openbao.bexonia-vault.svc.cluster.local:8200"

          BAO_TOKEN=$(curl -sf -X POST "${BAO_ADDR}/v1/auth/kubernetes/login" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg jwt "$SA_JWT" '{role: "bexonia-infra-runner", jwt: $jwt}')" \
            | jq -r '.auth.client_token')

          if [ -z "$BAO_TOKEN" ] || [ "$BAO_TOKEN" = "null" ]; then
            echo "ERROR: Failed to obtain OpenBao token for bexonia-infra-runner" >&2
            exit 1
          fi

          echo "::add-mask::${BAO_TOKEN}"
          echo "TF_VAR_openbao_token=${BAO_TOKEN}" >> "$GITHUB_ENV"

      - name: OpenTofu Init & Apply (opentofu/)
        working-directory: opentofu
        run: |
          set -euo pipefail
          tofu init -input=false
          if ! tofu state list 2>/dev/null | grep -q "kubernetes_deployment_v1.bexonia_learn"; then
            SA_JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
            CA_CRT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            K8S_API="https://kubernetes.default.svc"
            curl -sf --cacert "$CA_CRT" -H "Authorization: Bearer $SA_JWT" -X DELETE "${K8S_API}/apis/apps/v1/namespaces/bexonia-learn/deployments/bexonia-learn" >/dev/null || true
            curl -sf --cacert "$CA_CRT" -H "Authorization: Bearer $SA_JWT" -X DELETE "${K8S_API}/api/v1/namespaces/bexonia-learn/services/bexonia-learn" >/dev/null || true
            curl -sf --cacert "$CA_CRT" -H "Authorization: Bearer $SA_JWT" -X DELETE "${K8S_API}/api/v1/namespaces/bexonia-learn/configmaps/bexonia-learn-nginx" >/dev/null || true
            curl -sf --cacert "$CA_CRT" -H "Authorization: Bearer $SA_JWT" -X DELETE "${K8S_API}/apis/traefik.io/v1alpha1/namespaces/bexonia-learn/ingressroutes/bexonia-learn-route" >/dev/null || true
            sleep 2
          fi
          tofu apply -auto-approve -input=false
