function build() {

  spread(SERS, 3).forEach(c => makeProc('ser', c, .45, spot(.2)(c)));
  spread(ORG.poly.filter(c => !inWedge(c)), 10).forEach(c => makeProc('poly', c, .3, spot(.15)(c)));
  for (let i = FLOW_MAX - 1; i >= 0; i--) free.push(i);
  cell.add(flowPts, fxPts);
  const mat = reg('mt', phys({ color: '#93aecb', roughness: .45, emissive: '#5aa0e0', emissiveIntensity: .04 })), tipMat = reg('mt', phys({ color: '#e6fbff', emissive: '#9fe8ff', emissiveIntensity: 1.3 })), tipGeo = new THREE.SphereGeometry(.034, 12, 8);

}
function updateMTs(dt) {

// run the organelles, then move every symbol: along its route with a little jiggle, bobbing where it has docked, or being drawn in.

}

// ---------------------------------------------------------------------
// Post-processing: soft bloom, filmic output, lens
// ---------------------------------------------------------------------
const composer = new EffectComposer(renderer);

const lens = new ShaderPass({ uniforms: { tDiffuse: { value: null }, uRes: { value: new THREE.Vector2(innerWidth, innerHeight) }, uTime: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 uRes; uniform float uTime; varying vec2 vUv;
    float h(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main() {
      vec2 d = vUv - .5; float r2 = dot(d, d); vec2 o = d * r2 * .01;

composer.addPass(new RenderPass(scene, camera)); composer.addPass(bloom); composer.addPass(new OutputPass()); composer.addPass(lens);

function resize() {
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); bloom.resolution.set(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); lens.uniforms.uRes.value.set(innerWidth, innerHeight);
  const s = renderer.getDrawingBufferSize(new THREE.Vector2()).y / (2 * Math.tan(camera.fov * Math.PI / 360)); impMats.forEach(m => { m.uniforms.uScale.value = s; });
  // keep the whole cell in view on narrow screens
  const fit = Math.max(1, 1.45 / camera.aspect); controls.maxDistance = 95 * fit;
}
addEventListener('resize', resize);

// ---------------------------------------------------------------------
// Colour key with hover highlight, buttons, animation loop
// ---------------------------------------------------------------------
let hi = null;
const legend = document.getElementById('legend');
PARTS.forEach(([k, name, col]) => {
  const it = document.createElement('div'); it.className = 'it'; const sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = col; const t = document.createElement('span'); t.textContent = name;
  it.append(sw, t); legend.append(it);
  it.onmouseenter = () => setHi(k); it.onmouseleave = () => setHi(null);
});
{
  // key to the colours of the molecules inside the nucleus
  const k = document.createElement('div'); k.className = 'key';
  k.innerHTML = `<div class="row">Bases ${'ATGCU'.split('').map(b => `<span class="chip" style="background:${BASE[b]}">${b}</span>`).join('')}</div>`
    + `<div class="row">Histones ${HISTONE.map(([n, c]) => `<span class="dot" style="background:${c}"></span>${n}`).join(' ')}</div>`
    + `<div class="row"><span class="bar" style="background:${BACKBONE[0]}"></span><span class="bar" style="background:${BACKBONE[1]}"></span>DNA strands
       <span class="bar" style="background:${MRNA};margin-left:6px"></span>mRNA <span class="bar" style="background:${RRNA};margin-left:6px"></span>rRNA</div>`;
  legend.append(k);
}
// the metabolism key: hover a molecule to follow it; the note above it explains the hovered part
const tipBox = document.getElementById('tip'), TIP0 = 'Molecules dock on the organelle that asked for them. Once it has them all, they are drawn in, it lights up, and what it makes sets off. Hover a name on the left for its recipe, or a molecule below to follow it.';
tipBox.textContent = TIP0;
Object.entries(MOL).forEach(([k, [name, colour, g]]) => {
  const it = document.createElement('div'); it.className = 'mol'; const cv = document.createElement('canvas'); cv.width = cv.height = 44; glyph(cv.getContext('2d'), g, 3, 3, 38, colour);
  const t = document.createElement('span'); t.textContent = name; it.append(cv, t); document.getElementById('mols').append(it);
  it.onmouseenter = () => { molHi = k; }; it.onmouseleave = () => { molHi = null; };
});
function showInfo(k) {
  const inf = k && INFO[k]; tipBox.replaceChildren();
  if (!inf) { tipBox.textContent = TIP0; return; }
  const b = document.createElement('b'); b.textContent = PARTS.find(p => p[0] === k)[1];
  tipBox.append(b, document.createElement('br'), `Takes in: ${inf[0]}`, document.createElement('br'), `Gives out: ${inf[1]}`);
}
function setHi(k) {
  if (hi && REG[hi]) { REG[hi].mats.forEach(m => { m.emissive.copy(m.userData.e0); m.emissiveIntensity = m.userData.i0; }); REG[hi].imp.forEach(m => { m.uniforms.uHi.value = 0; }); }
  hi = k && REG[k] ? k : null;
  if (hi) REG[hi].mats.forEach(m => { m.userData.e0 ??= m.emissive.clone(); m.userData.i0 ??= m.emissiveIntensity; });
  showInfo(hi);
}
const hiCol = k => new THREE.Color(PARTS.find(p => p[0] === k)[2]);
let motion = true, sway = 0, last = performance.now();
// preset views, in the cell's own frame: the whole cell, the opened nucleus, the nucleolus, and a close look at the DNA where a gene is being read
const VIEWS = [['cell', V(23, 12.5, 30), V(-3, -.4, 0)], ['nucleus', V(6.5, 4.2, 8.2), V(-.6, .3, -.5)], ['nucleolus', V(2.9, 1.6, 2.2), V(-.2, 1, 1.3)], ['DNA', V(.95, -1.65, .55), V(.8, -1.77, -.13)]];
let view = 0;
document.getElementById('view').onclick = e => { view = (view + 1) % VIEWS.length; const [name, p, t] = VIEWS[view]; camera.position.copy(cell.localToWorld(p.clone())); controls.target.copy(cell.localToWorld(t.clone())); e.target.textContent = `View: ${name}`; };
document.getElementById('look').onclick = e => { organelleLook = LOOKS[(LOOKS.indexOf(organelleLook) + 1) % LOOKS.length]; applyLook(); e.target.textContent = `Organelles: ${organelleLook}`; };
document.getElementById('cut').onclick = e => { cutOn = !cutOn; caps.visible = cutOn; e.target.textContent = cutOn ? 'Close cutaway' : 'Open cutaway'; };
document.getElementById('flow').onclick = e => {
  flowsOn = !flowsOn; flowPts.visible = fxPts.visible = flowsOn; e.target.textContent = `Metabolism: ${flowsOn ? 'on' : 'off'}`;
  if (!flowsOn) { PROCS.forEach(p => { p.gt = 9; p.glow = 0; }); applyGlows(); }   // nothing left glowing
};
// the speed slider: from an eighth of the normal pace to four times it (double-click for normal)
const speed = document.getElementById('speed'), spd = document.getElementById('spd');
speed.oninput = () => { flowSpeed = 2 ** +speed.value; spd.textContent = `${flowSpeed >= 1 ? +flowSpeed.toFixed(1) : +flowSpeed.toFixed(2)}×`; };
speed.ondblclick = () => { speed.value = 0; speed.oninput(); };
document.getElementById('motion').onclick = e => { motion = !motion; e.target.textContent = motion ? 'Pause' : 'Play'; };
document.getElementById('snap').onclick = () => { composer.render(); const a = document.createElement('a'); a.download = 'animal-cell-realistic.png'; a.href = renderer.domElement.toDataURL('image/png'); a.click(); };
// free look: W and S move along the view, A and D sideways; the camera and the point it turns around move together,
// so dragging still turns the view as before. Steps scale with the zoom, so moving feels the same close up and far away
const held = new Set();
addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (k.length === 1 && 'wasd'.includes(k) && !e.target.closest?.('input, textarea') && !e.metaKey && !e.ctrlKey) held.add(k); });
addEventListener('keyup', e => held.delete(e.key.toLowerCase()));
addEventListener('blur', () => held.clear());
const fwd = V(), side = V(), step = V();
// mouse look: a left-drag turns the camera where it stands (drag right to look right, down to look down) instead of swinging
// it around the cell; the point the camera looks at is moved in front of it, so scrolling and right-drag panning still work
controls.enableRotate = false;
let lookFrom = null;
const aim = new THREE.Spherical();
renderer.domElement.addEventListener('pointerdown', e => { if (e.button === 0) { lookFrom = [e.clientX, e.clientY]; renderer.domElement.setPointerCapture(e.pointerId); } });
renderer.domElement.addEventListener('pointermove', e => {
  if (!lookFrom) return;
  const dx = e.clientX - lookFrom[0], dy = e.clientY - lookFrom[1]; lookFrom = [e.clientX, e.clientY];
  aim.setFromVector3(controls.target.clone().sub(camera.position));
  aim.theta -= dx * .004; aim.phi = Math.min(Math.PI - .05, Math.max(.05, aim.phi + dy * .004));
  controls.target.copy(camera.position).add(V().setFromSpherical(aim));
});
for (const ev of ['pointerup', 'pointercancel']) renderer.domElement.addEventListener(ev, () => { lookFrom = null; });
function freeMove(dt) {
  if (!held.size) return;

  step.set(0, 0, 0).addScaledVector(fwd, held.has('w') - held.has('s')).addScaledVector(side, held.has('d') - held.has('a'));
  if (step.lengthSq() < 1e-6) return;

const lightView = V();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (motion) {
    // the cell sways slowly; close up the sway eases to a stop so molecules stay in view
    sway += dt * Math.min(1, Math.max(0, (camera.position.distanceTo(controls.target) - 3) / 15)); cell.rotation.y = .3 * Math.sin(sway * .11);
    movers.forEach(o => { o.t = (o.t + dt * o.v * flowSpeed) % 1; o.m.position.copy(o.curve.getPointAt(o.t)); });
    updateMTs(dt * flowSpeed);

  if (flowsOn) updateFlows(motion ? dt * flowSpeed : 0);   // the speed control sets how fast the cell's work runs
  flowBoost(camera.position.distanceTo(controls.target));
  cell.updateMatrixWorld(); updateCut(); fxFollow(); applyGlows();
  lightView.copy(key.position).normalize().transformDirection(camera.matrixWorldInverse); impMats.forEach(m => m.uniforms.uLight.value.copy(lightView));
  if (hi) { const k = .55 + .45 * Math.sin(now / 180), c = hiCol(hi); REG[hi].mats.forEach(m => { m.emissive.copy(c); m.emissiveIntensity = .25 + .75 * k; }); REG[hi].imp.forEach(m => { m.uniforms.uHi.value = k; }); }

}
setTimeout(() => {   // a moment for the "Building" note to show; a timer rather than a frame, so a page opened in the background builds too
  build(); buildFlows(); applyLook(); resize(); renderer.setAnimationLoop(frame);
  document.getElementById('busy').style.display = 'none';
}, 30);
// render one frame from another camera pose (for scripted checks), then put the viewer's camera back
async function shot(pos, target, name) {
  const p0 = camera.position.clone(), t0 = controls.target.clone();
  camera.position.copy(pos); controls.target.copy(target); camera.lookAt(target); camera.updateMatrixWorld(); flowBoost(pos.distanceTo(target));
  cell.updateMatrixWorld(); updateCut(); fxFollow(); applyGlows(); lightView.copy(key.position).normalize().transformDirection(camera.matrixWorldInverse); impMats.forEach(m => m.uniforms.uLight.value.copy(lightView)); composer.render();
  const blob = await new Promise(r => renderer.domElement.toBlob(r, 'image/png'));
  camera.position.copy(p0); controls.target.copy(t0); camera.lookAt(t0); composer.render();
  await fetch('/save?name=' + name, { method: 'POST', body: blob }); return name;
}
window.__cell = { renderer, composer, camera, controls, scene, cell, REG, shells, setHi, shot, V, setLook: k => { organelleLook = k; applyLook(); }, get placed() { return placed.length; }, get sites() { return SITES; }, get flows() { return live; }, get org() { return ORG; }, get procs() { return PROCS; }, setMol: k => { molHi = k; }, step: (dt = .05, n = 1) => { for (let i = 0; i < n; i++) { updateFlows(dt); updateMTs(dt); } } };
