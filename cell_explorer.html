<title>Cell Explorer</title>
<style>

  * { box-sizing: border-box; }

  button { font: inherit; color: inherit; }

  #tree { border-right: 1px solid var(--line); padding: 14px 0 24px; }
  #info { border-left: 1px solid var(--line); padding: 18px 20px 28px; }
  .hd { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 16px 10px; }

  .nm { flex: 1; text-align: left; background: none; border: 0; padding: 5px 4px; cursor: pointer; font-size: 13px; line-height: 1.25; }
  .row.cur .nm { color: var(--accent); }
  #stage { position: relative; overflow: hidden; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .lbl.link { border-color: rgba(127,216,255,.55); color: #c9f1ff; cursor: pointer; }

  #legend .bar { width: 20px; height: 7px; border-radius: 4px; flex: none; }

  .speed input { flex: 1; min-width: 0; accent-color: var(--accent); }
  #spd { width: 38px; text-align: right; color: var(--fg); font-variant-numeric: tabular-nums; }
  #tip b { color: var(--fg); font-weight: 600; }
  .mol { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 7px; font-size: 12.5px; }
  .mol:hover { background: var(--accent-bg); }
  .mol img { width: 22px; height: 22px; flex: none; }
  .note { margin-top: 22px; font-size: 12px; color: var(--muted); line-height: 1.5; border-top: 1px solid var(--line); padding-top: 12px; }
  @media (max-width: 900px) {
    html, body { overflow: auto; }
    #app { grid-template-columns: 1fr; grid-template-rows: 62vh auto auto; height: auto; }

    #tree { order: 3; border-right: 0; border-top: 1px solid var(--line); }
    .lbl { font-size: 11px; }
    #hint { display: none; }
  }

      for (let i = 1; i <= n; i++) { const t = i * 1.745; pts.push(p.clone().addScaledVector(ax, i * .15).addScaledVector(u, .23 * Math.cos(t) - .23).addScaledVector(w, .23 * Math.sin(t))); }
    } else for (let i = 0; i < 7; i++) {

      if (q.length() > size) { dir.addScaledVector(q.clone().normalize(), -1.6).normalize(); q = pts.at(-1).clone().addScaledVector(dir, .38); }
      pts.push(q);

  const rad = Math.max(...all.map(q => q.distanceTo(c))) * .82 + .35;
  const sf = blob(rad, xray(surf, .6, 2.2, .008), .12, 1.6); sf.position.copy(c); g.add(sf);

const ATOMS = { H: { Z: 1, N: 0, sh: [1] }, C: { Z: 6, N: 6, sh: [2, 4] }, N: { Z: 7, N: 7, sh: [2, 5] }, O: { Z: 8, N: 8, sh: [2, 6] }, P: { Z: 15, N: 16, sh: [2, 8, 5] }, Mg: { Z: 12, N: 12, sh: [2, 8, 2] } };
function buildAtom(sym) {

  const types = [...Array(a.Z).fill(1), ...Array(a.N).fill(0)];

  let pP = null, pN = null;
  types.forEach((t, i) => {
    const p = tot === 1 ? V() : fibDir(i, tot).multiplyScalar(rn * Math.cbrt((i + .5) / tot) + .05);
    const s = sphere(.3, std(t ? '#ff4d4d' : '#aab4c3', { glow: t ? .35 : .1 })); s.position.copy(p); g.add(s);
    if (t && (!pP || p.z > pP.z)) pP = p; if (!t && (!pN || p.z > pN.z)) pN = p;
  });

    sg.rotation.set(rr(-1, 1), rr(-1, 1), rr(-1, 1));
    sg.add(new THREE.Mesh(new THREE.TorusGeometry(r, .018, 8, 160), xray('#7fd8ff', 1, 1, .45)), piv);
    for (let j = 0; j < n; j++) { const t = j / n * Math.PI * 2, e = sphere(.13, std('#8fe8ff', { glow: 1.4 })); e.position.set(r * Math.cos(t), r * Math.sin(t), 0); piv.add(e); }
    const sp = .9 / (k + 1); piv.userData.tick = dt => { piv.rotation.z += dt * sp; };
    g.add(sg); sg.updateMatrix();

function buildMicrotubule(len = 48, cut = true) {
  const g = new THREE.Group(), R = 11.5, mono = 4, pf = 13, ms = [], cs = [], cA = new THREE.Color('#9fe3ff'), cB = new THREE.Color('#3f7dff'); let front = null;
  for (let j = 0; j < pf; j++) {
    const th = j / pf * Math.PI * 2;
    for (let k = 0; k * mono < len; k++) {
      const y = k * mono + j * (3 * mono / pf) - len / 2;
      if (cut && j >= 2 && j <= 4 && y > 0) continue;
      const p = V(R * Math.cos(th), y, R * Math.sin(th));
      ms.push(M4(p, new THREE.Quaternion(), V(2.1, 2, 2.1))); cs.push(k % 2 ? cB : cA);
      if (k % 2 === 0 && Math.abs(y + len * .2) < 3 && (!front || p.z > front.z)) front = p.clone();
    }
  }
  g.add(instanced(sphGeo, plain(), ms, cs));
  return finalize(g, [A(front, 'Tubulin dimer (α + β)', 'tubulin'), A(V(R * Math.cos(1.2), -len * .35, R * Math.sin(1.2)), 'Protofilament (1 of 13)'),
    A(V(0, len * .25, 0), 'Hollow lumen'), A(V(0, len / 2 + 2, 0), 'Plus end (grows)'), A(V(0, -len / 2 - 2, 0), 'Minus end')]);
}
function buildActin(len = 60) {
  const g = new THREE.Group(), ms = [], cs = [], rise = 2.75, tw = -166.6 * Math.PI / 180, r = 2.4, c1 = new THREE.Color('#ff8a5c'), c2 = new THREE.Color('#ffc06a'); let front = null;
  for (let i = 0; i * rise < len; i++) {
    const a = i * tw, p = V(r * Math.cos(a), i * rise - len / 2, r * Math.sin(a));
    ms.push(M4(p, new THREE.Quaternion(), V(2.6, 2.4, 2.6))); cs.push(i % 2 ? c1 : c2);
    if (Math.abs(p.y) < 6 && (!front || p.z > front.z)) front = p.clone();

  return finalize(g, [A(front, 'G-actin monomer', 'g-actin'), A(V(0, len / 2 + 2, 0), 'Plus (barbed) end'), A(V(0, -len / 2 - 2, 0), 'Minus (pointed) end'), A(V(2.5, len * .3, 2), 'Two strands twist (~37 nm repeat)')]);
}

  [3.4, 4.1].forEach((y, i) => layer(y, i * .9 + 1.1, 1.2, cB, .6));
  g.add(instanced(unitCyl, plain(), fib, fc));
  const hm = std('#ffd24f', { glow: .3 }); let hc = null;

    const a = V(rr(-W / 2 + 1, W / 2 - 1), rr(-2.6, .9), rr(-D / 2 + 1, D / 2 - 1)); if (Math.hypot(a.x - hole.x, a.z - hole.z) < HR + .6) continue;

function buildMicrofibril() {

    desc: 'The enzyme that copies a gene into mRNA. Its σ factor finds where a gene starts; the pincers clamp the DNA, open a short bubble and build RNA along the template strand, about 40 letters per second.' },
  'capsule': { name: 'Capsule', scale: '0.2–1 µm thick', b: buildCapsule, children: ['glucose', 'phospholipid'],
    desc: 'A slimy outer layer of long sugar chains that holds water. It protects the bacterium from drying out, helps it stick to surfaces and hides it from the immune system.' },
  'lps': { name: 'Lipopolysaccharide (LPS)', scale: '~10–20 nm long', b: buildLPS, children: ['fatty-acid-tail', 'phosphate', 'glucose'],
    desc: 'The molecule that coats the outer membrane of Gram-negative bacteria: a lipid A anchor (the toxic part, also called endotoxin), a core sugar chain and a long O-antigen of repeating sugars.' },
  'porin': { name: 'Porin', scale: '~5 nm wide', b: buildPorin, children: ['protein', 'water', 'phospholipid'],
    desc: 'A barrel of 16 β-strands that forms a water-filled pore through the outer membrane, usually as a group of three. Small molecules such as ions, sugars and water pass through.' },
  'storage-granule': { name: 'Storage granules', scale: '50–500 nm', b: buildGranules, children: ['glucose', 'phosphate', 'protein'],
    desc: 'Inclusion bodies where bacteria stockpile resources: glycogen for sugar, polyphosphate for phosphate and energy, and PHB (a natural plastic) for carbon, coated with phasin proteins.' },
  'proteasome': { name: 'Proteasome', scale: '~45 nm', b: buildProteasome, children: ['protein', 'polypeptide'],
    desc: 'The cell\u2019s shredder for unwanted proteins. Proteins tagged with a chain of ubiquitin are recognised by a 19S cap, unfolded and threaded into the 20S barrel, where β subunits cut them into short peptides.' },
  'motor-protein': { name: 'Motor proteins', scale: '~60–80 nm', b: buildMotors, children: ['microtubule', 'protein', 'vesicle'],
    desc: 'Proteins that walk along microtubules carrying cargo. Kinesin steps toward the plus end (out to the cell edge), dynein toward the minus end (in to the centre), each step 8 nm and powered by one ATP. Animated.' },
  'electron-transport-chain': { name: 'Electron transport chain', scale: '~20 nm tall', b: () => buildETC(false), children: ['protein', 'atp-synthase', 'water', 'phospholipid'],
    desc: 'A relay of protein complexes in the inner mitochondrial membrane. Electrons from food (via NADH) hop from complex I to IV and finally onto oxygen, making water. Their energy pumps protons across the membrane, and the protons flowing back through ATP synthase make ATP. The electron is animated. Bacteria run the same kind of chain in their inner (plasma) membrane.' },
  'light-reactions': { name: 'Light reactions (thylakoid electron chain)', scale: '~20 nm tall', b: () => buildETC(true), children: ['photosystem-ii', 'protein', 'atp-synthase', 'water', 'phospholipid'],
    desc: 'The chain that turns sunlight into chemical energy. Photosystem II splits water and passes electrons through plastoquinone, cytochrome b₆f, plastocyanin and photosystem I to ferredoxin, where FNR makes NADPH. Protons pumped into the lumen drive ATP synthase. The electron is animated.' },
  'cilium': { name: 'Primary cilium', scale: '~0.25 µm wide, 2–10 µm long', b: buildCilium, children: ['microtubule', 'motor-protein', 'centriole', 'phospholipid'],
    desc: 'A hair-like antenna built on a centriole (the basal body). Inside is the axoneme: nine doublet microtubules around a central pair. In motile cilia, dynein arms slide the doublets to make the cilium beat; primary cilia sense signals from outside.' },
  'gpcr': { name: 'G-protein-coupled receptor', scale: '~5 nm', b: buildGPCR, children: ['alpha-helix', 'protein', 'phospholipid'],
    desc: 'A receptor whose chain crosses the membrane seven times. When a signal molecule such as a hormone binds outside, it changes shape and switches on a G protein inside (Gα swaps GDP for GTP). About a third of all medicines target these receptors.' },
  'na-k-pump': { name: 'Sodium–potassium pump', scale: '~10 nm', b: buildNaKPump, children: ['protein', 'phospholipid'],
    desc: 'An animal-cell pump that uses one ATP to push 3 Na⁺ out and bring 2 K⁺ in. The gradients it builds power nerve signals and many other transporters; it can use a quarter of a cell\u2019s energy.' },
  'cell-junction': { name: 'Cell junctions', scale: '10–200 nm', b: buildJunctions, children: ['protein', 'intermediate-filament', 'phospholipid'],
    desc: 'How animal cells join their neighbours: tight junctions seal the gap so fluid cannot leak between cells, desmosomes rivet cells together through keratin filaments, and gap junctions open channels that let ions and small molecules pass directly from cell to cell.' },
  'cellulose-synthase': { name: 'Cellulose synthase complex', scale: '~25 nm', b: buildCelluloseSynthase, children: ['protein', 'cellulose', 'glucose'],
    desc: 'A rosette of 18 CESA proteins in the plasma membrane. Each uses UDP-glucose to spin one cellulose chain out into the wall, and the 18 chains bundle at once into a microfibril. Cortical microtubules guide which way it moves.' },
  'amyloplast': { name: 'Amyloplast', scale: '1–5 µm', b: buildAmyloplast, children: ['starch', 'phospholipid', 'dna'],
    desc: 'A colourless plastid that stores starch, common in roots, tubers and seeds (a potato is packed with them). In root tips the heavy starch grains sink to the bottom of the cell, telling the root which way is down.' },
  'plant-cell': { name: 'Eukaryotic cell (plant)', scale: '10–100 µm', b: buildPlantCell, children: ['cell-wall', 'plasma-membrane', 'central-vacuole', 'chloroplast', 'nucleus', 'rough-er', 'smooth-er', 'golgi', 'mitochondrion', 'peroxisome', 'plasmodesma', 'cytoskeleton', 'ribosome', 'cytosol', 'amyloplast'],
    desc: 'A eukaryotic cell with three things animal cells lack: a rigid cellulose cell wall, chloroplasts that turn sunlight into sugar, and a large central vacuole whose water pressure keeps the cell firm. It has no centrioles, and the vacuole does much of the recycling that lysosomes do in animal cells.' },
  'cell-wall': { name: 'Cell wall', scale: '0.1–10 µm thick', b: buildCellWall, children: ['cellulose-microfibril', 'plasmodesma', 'cellulose-synthase'],
    desc: 'A tough layer outside the plasma membrane. Cellulose microfibrils, laid in criss-crossing layers, are tied together by hemicellulose and embedded in a pectin gel. The middle lamella glues neighbouring cells together.' },
  'cellulose-microfibril': { name: 'Cellulose microfibril', scale: '3–5 nm wide', b: buildMicrofibril, children: ['cellulose'],
    desc: 'About 18–36 cellulose chains lined up side by side and held by hydrogen bonds into a crystalline cable, stronger for its weight than steel. Spun out by cellulose synthase rosettes in the plasma membrane.' },
  'cellulose': { name: 'Cellulose chain', scale: '~0.5 nm per glucose', b: buildCellulose, children: ['glucose', 'atom-c', 'atom-o', 'atom-h'],
    desc: 'Thousands of glucose units joined by β-1,4 bonds, each unit flipped 180° from the last. The flip makes the chain straight and flat, so chains pack tightly. It is the most abundant organic molecule on Earth.' },
  'plasmodesma': { name: 'Plasmodesma', scale: '~50 nm wide', b: buildPlasmodesma, children: ['phospholipid', 'smooth-er', 'protein'],
    desc: 'A channel through the cell wall that joins the cytoplasm of neighbouring cells. Its membrane lining is continuous between both cells, and a thin tube of ER (the desmotubule) runs down the middle. Water, sugars and even some proteins and RNAs pass through.' },
  'central-vacuole': { name: 'Central vacuole', scale: 'up to 90% of cell volume', b: buildVacuole, children: ['phospholipid', 'channel-protein', 'water', 'protein'],
    desc: 'A huge sac of watery cell sap wrapped in the tonoplast membrane. Water pumped in builds turgor pressure that keeps the plant upright. It also stores ions, sugars, pigments and waste, and breaks down old cell parts. Shown as a cutaway.' },
  'chloroplast': { name: 'Chloroplast', scale: '5–10 µm', b: buildChloroplast, children: ['granum', 'rubisco', 'starch', 'dna', 'ribosome', 'phospholipid'],
    desc: 'Where photosynthesis happens. Thylakoid membranes, stacked into grana, capture light and make ATP and NADPH; enzymes in the surrounding stroma use them to turn CO₂ into sugar. Like mitochondria, chloroplasts have their own DNA and ribosomes, a legacy of an ancient cyanobacterium. Shown as a cutaway.' },
  'granum': { name: 'Granum (thylakoid stack)', scale: '~0.5 µm wide', b: buildGranum, children: ['photosystem-ii', 'atp-synthase', 'phospholipid', 'light-reactions'],
    desc: 'A stack of flattened thylakoid discs, linked to other stacks by stroma lamellae. Protein complexes in the membrane run the light reactions and pump protons into the lumen, and ATP synthase uses that gradient to make ATP. The discs are cut open.' },
  'photosystem-ii': { name: 'Photosystem II', scale: '~20 nm', b: buildPhotosystem, children: ['chlorophyll', 'protein', 'water', 'phospholipid'],
    desc: 'A protein complex that uses light to split water. Antenna chlorophylls pass absorbed energy to the reaction centre, which sends an electron down the transport chain. The oxygen-evolving complex replaces it by pulling electrons from water, releasing the oxygen we breathe.' },
  'chlorophyll': { name: 'Chlorophyll a', scale: '~1.5 nm (ring)', b: buildChlorophyll, children: ['atom-mg', 'atom-c', 'atom-n', 'atom-o', 'atom-h'],
    desc: 'The green pigment. A flat porphyrin ring around a magnesium ion absorbs red and blue light and reflects green, and a long phytol tail anchors it in the thylakoid membrane. Simplified: some side groups and hydrogens are left out.' },
  'rubisco': { name: 'RuBisCO', scale: '~11 nm', b: buildRubisco, children: ['protein', 'alpha-helix', 'amino-acid'],
    desc: 'The enzyme that fixes CO₂ from the air into sugar in the Calvin cycle, and probably the most abundant protein on Earth. It is built from 8 large and 8 small subunits.' },
  'starch': { name: 'Starch', scale: 'grains 1–100 µm', b: buildStarch, children: ['glucose'],
    desc: 'How plants store sugar. Amylose is a helical chain of glucose (α-1,4 links), and amylopectin branches every 24–30 units through α-1,6 links. Both pack into grains in chloroplasts and amyloplasts.' },
  'peroxisome': { name: 'Peroxisome', scale: '0.2–1 µm', b: buildPeroxisome, children: ['protein', 'phospholipid'],
    desc: 'A small single-membrane organelle packed with oxidising enzymes. It breaks down fatty acids, makes and then destroys hydrogen peroxide (with catalase), and in leaves helps recycle the by-products of photorespiration. Shown as a cutaway.' },
  // the realistic cell: each level is a preset view of animal_cell_realistic.html, shown inside the stage. `real` names the view,
  // `hi` the part it lights up; each tag is [named point in that page, text, child it opens (or null), part it lights up on hover]
  'real-cell': { name: 'Eukaryotic cell (realistic)', scale: '10–30 µm', real: 'cell',
    children: ['plasma-membrane', 'real-nucleus', 'rough-er', 'ribosome', 'smooth-er', 'golgi', 'mitochondrion', 'lysosome', 'peroxisome', 'vesicle', 'lipid-droplet', 'centrosome', 'microtubule', 'actin-filament', 'intermediate-filament', 'cilium', 'microvillus', 'cytosol'],
    tags: [['membrane', 'Plasma membrane', 'plasma-membrane', 'membrane'], ['nucleus', 'Nucleus', 'real-nucleus', 'nucleus'], ['rer', 'Rough ER', 'rough-er', 'rer'], ['ribo', 'Ribosomes', 'ribosome', 'ribosome'],
      ['ser', 'Smooth ER', 'smooth-er', 'ser'], ['golgi', 'Golgi apparatus', 'golgi', 'golgi'], ['mito', 'Mitochondrion', 'mitochondrion', 'mito'], ['lyso', 'Lysosome', 'lysosome', 'lyso'],
      ['perox', 'Peroxisome', 'peroxisome', 'perox'], ['endo', 'Endosome & vesicles', 'vesicle', 'vesicle'], ['lipid', 'Lipid droplet', 'lipid-droplet', 'lipid'], ['centro', 'Centrosome', 'centrosome', 'centro'],
      ['mt', 'Microtubules', 'microtubule', 'mt'], ['actin', 'Actin cortex', 'actin-filament', 'actin'], ['if', 'Intermediate filaments', 'intermediate-filament', 'if'], ['cilium', 'Primary cilium', 'cilium', 'cilium'],
      ['villi', 'Microvilli', 'microvillus', 'cilium'], ['cytosol', 'Cytosol', 'cytosol', 'cytosol']],
    desc: 'The same animal cell drawn as realistically as this project can: cut open, with gel-like organelles in a crowded cytoplasm and a nucleus built molecule by molecule. It is alive: molecules travel between the organelles, dock on the one that asked for them, and it lights up as it makes its product. Shapes and arrangements follow real biology; molecules are drawn far larger than life so they can be seen.' },
  'real-nucleus': { name: 'Nucleus (realistic)', scale: '5–10 µm', real: 'nucleus', hi: 'nucleus',
    children: ['nuclear-envelope', 'nuclear-pore', 'chromosome', 'real-dna', 'real-nucleolus', 'rna', 'pcna', 'ubiquitin'],
    tags: [['env', 'Nuclear envelope', 'nuclear-envelope', 'nucleus'], ['pore', 'Nuclear pore', 'nuclear-pore', 'nucleus'], ['export', 'mRNA leaving through a pore', 'rna', 'mrna'],
      ['chromatin', 'Chromatin: DNA on histones', 'chromosome', 'chromatin'], ['gene', 'Gene being read', 'real-dna', 'mrna'], ['nucleolus', 'Nucleolus', 'real-nucleolus', 'nucleolus'],
      ['mrnp', 'Finished mRNA, packed in proteins', 'rna', 'mrna'], ['pcna', 'PCNA clamp', 'pcna', 'nucleoplasm'], ['ubiq', 'Ubiquitin', 'ubiquitin', 'nucleoplasm']],
    desc: 'The nucleus cut open, about 20 times larger than life at the molecular scale. Its 46 chromosomes are each one DNA molecule wound on histones and folded into its own territory (about 2,600 nucleosomes in all, instead of the real 30 million). In about a third of them a gene is being read. Finished mRNAs, packed in proteins, drift to the pores and leave cap first. The nucleolus sits on the cut, and real PCNA and ubiquitin proteins fill the spaces between.' },
  'real-nucleolus': { legend: LEG_REAL, name: 'Nucleolus (realistic)', scale: '1–3 µm', real: 'nucleolus', hi: 'nucleolus', children: ['dna', 'rna', 'protein', 'ribosome'],
    tags: [['fc', 'Fibrillar centre: rDNA genes', 'dna', 'nucleolus'], ['pol1', 'RNA polymerase I', null, 'nucleolus'], ['tree', 'rRNA "Christmas tree"', 'rna', 'rrna'],
      ['dfc', 'Dense fibrillar component', 'protein', 'nucleolus'], ['gc', 'Granular component: pre-ribosomes', 'ribosome', 'rrna']],
    desc: 'Where ribosomes are made. Pale fibrillar centres hold loops of rDNA. A row of RNA polymerase I reads each rDNA gene, and its rRNA transcripts get longer along the gene, so every gene looks like a Christmas tree. In the dense fibrillar shell around it, fibrillarin and small nucleolar RNAs cut and modify the rRNA; in the granular part outside, it folds with ribosomal proteins into the two ribosome halves, which leave through the nuclear pores.' },
  'real-dna': { legend: LEG_REAL, name: 'Gene being read (realistic)', scale: '~50–100 nm across', real: 'DNA', hi: 'chromatin', children: ['pol-ii', 'rna', 'dna', 'nucleosome', 'histone', 'nucleotide'],
    tags: [['pol2', 'RNA polymerase II', 'pol-ii', 'mrna'], ['nascent', 'New mRNA', 'rna', 'mrna'], ['dna', 'DNA double helix', 'dna', 'chromatin'],
      ['bp', 'Base pair: two nucleotides', 'nucleotide', 'chromatin'], ['nuc', 'Nucleosome', 'nucleosome', 'chromatin'], ['hist', 'Histone core', 'histone', 'chromatin']],
    desc: 'Transcription up close. Three nucleosomes are cleared so the DNA runs bare, and RNA polymerase II (its real structure) sits on it, opening the two strands and copying one into mRNA. The new mRNA grows out of the polymerase, folding into small hairpins; proteins coat it as it grows, and a cap-binding complex holds its 5′ end. Each base pair is a rod coloured half for each base, with a silver ball where it joins its strand.' },
  'pol-ii': { name: 'RNA polymerase II', scale: '~15 nm', b: buildPolII, children: ['polypeptide', 'alpha-helix', 'amino-acid'],
    desc: 'The enzyme that copies genes into mRNA. This is its real structure (yeast Pol II, PDB 1I50, 10 of its 12 subunits), one bead for each amino acid backbone and one for each side chain, coloured by subunit. DNA enters a deep cleft between the two largest subunits, Rpb1 and Rpb2, where the active site adds roughly 20–60 nucleotides a second. The long tail of Rpb1 is too floppy to show in a crystal, so it is missing.' },
  'pcna': { name: 'PCNA sliding clamp', scale: '~8 nm across', b: buildPCNA, children: ['polypeptide', 'alpha-helix', 'amino-acid'],
    desc: 'Three identical proteins joined head to tail into a ring (human PCNA, PDB 1AXC). The ring closes around DNA and slides along it, holding DNA polymerase on while DNA is copied or repaired. α-helices line the hole, where they touch the DNA.' },
  'ubiquitin': { name: 'Ubiquitin', scale: '~3 nm', b: buildUbiquitin, children: ['alpha-helix', 'polypeptide', 'amino-acid'],
    desc: 'A small protein of 76 amino acids (PDB 1UBQ) that the cell uses as a tag. Enzymes bond its last amino acid, Gly76, to a lysine of a target protein. A chain of four or more ubiquitins linked through Lys48 sends the target to the proteasome to be broken down; other chain types signal repair or sorting.' },
  'lipid-droplet': { name: 'Lipid droplet', scale: '0.1–5 µm (larger in fat cells)', b: buildLipidDroplet, children: ['phospholipid', 'fatty-acid-tail', 'cholesterol', 'protein'],
    desc: 'The cell\'s fat store. Unlike other organelles it has no bilayer: a single layer of phospholipids, tails pointing in, wraps a core of neutral fat (triglycerides and cholesterol esters). It buds from the smooth ER, and perilipin proteins on its surface decide when the fat is released as fatty acids for the mitochondria.' },
  'microvillus': { name: 'Microvillus', scale: '~0.1 µm wide, 1–2 µm long', b: buildMicrovillus, children: ['plasma-membrane', 'actin-filament', 'protein', 'intermediate-filament'],
    desc: 'A finger of plasma membrane that multiplies the surface for absorbing, as in the brush border of the gut. Its core is a tight bundle of parallel actin filaments with their plus ends at the tip, cross-linked by villin and fimbrin and tied to the membrane by myosin-1a. At the base, the bundle roots into the terminal web.' },
  // the realistic bacterium (prokaryote_cell_realistic.html): an E. coli with everything drawn to one scale
  'real-bacterium': { name: 'Prokaryotic cell (realistic)', scale: '~2 µm × 0.9 µm', real: 'cell', page: 'prokaryote_cell_realistic.html',
    children: ['real-envelope', 'peptidoglycan', 'plasma-membrane', 'electron-transport-chain', 'atp-synthase', 'real-motor', 'pilus', 'real-pole', 'real-nucleoid', 'rna-polymerase', 'ribosome-70s', 'protein', 'storage-granule'],
    tags: [['om', 'Outer membrane', 'real-envelope', 'om'], ['pg', 'Peptidoglycan wall', 'peptidoglycan', 'pg'], ['im', 'Inner membrane', 'plasma-membrane', 'im'], ['etc', 'Respiratory chain', 'electron-transport-chain', 'etc'],
      ['atps', 'ATP synthase', 'atp-synthase', 'atps'], ['transport', 'Transporters', null, 'transport'], ['flag', 'Flagellum', 'real-motor', 'flag'], ['pili', 'Pili', 'pilus', 'pili'],
      ['chemo', 'Chemoreceptor array', 'real-pole', 'chemo'], ['mreb', 'MreB filaments', null, 'mreb'], ['dna', 'Nucleoid: the chromosome', 'real-nucleoid', 'dna'], ['rnap', 'RNA polymerases on an rRNA gene', 'rna-polymerase', 'rnap'],
      ['mrna', 'Polysome: an mRNA and its ribosomes', 'ribosome-70s', 'mrna'], ['ribosome', 'Ribosomes', 'ribosome-70s', 'ribosome'], ['cyto', 'Cytoplasm proteins', 'protein', 'cyto'], ['glycogen', 'Glycogen granule', 'storage-granule', 'glycogen']],
    desc: 'A realistic Escherichia coli, cut open, with everything at its true size, molecules included: 1 scene unit is 100 nm. It has no nucleus and no organelles. A three-layer envelope wraps a crowded cytoplasm, and the chromosome (all 4.6 million base pairs) folds into the nucleoid in the middle. Its work runs on protons: the respiratory chain pumps them out, and their flow back in drives ATP synthase and spins the flagella.' },
  'real-envelope': { name: 'Cell envelope (realistic)', scale: '~35 nm thick', real: 'envelope', page: 'prokaryote_cell_realistic.html', hi: 'om',
    children: ['lps', 'porin', 'peptidoglycan', 'plasma-membrane', 'atp-synthase', 'electron-transport-chain', 'ribosome-70s'],
    tags: [['lps', 'LPS: lipid A and its sugars', 'lps', 'om'], ['porin', 'Porin (OmpF)', 'porin', 'porin'], ['lpp', "Braun's lipoprotein", null, 'pg'], ['pg', 'Peptidoglycan wall', 'peptidoglycan', 'pg'],
      ['peri', 'Periplasmic protein', null, 'pg'], ['im', 'Inner membrane', 'plasma-membrane', 'im'], ['atps', 'ATP synthase', 'atp-synthase', 'atps'], ['etc', 'Respiratory chain', 'electron-transport-chain', 'etc'],
      ['transport', 'Transporter', null, 'transport'], ['ribosome', 'Ribosome', 'ribosome-70s', 'ribosome']],
    desc: 'The gram-negative envelope, molecule by molecule. Outside, an outer membrane whose outer leaflet is LPS, a barrier to many antibiotics, with porins letting small molecules through. Then the periplasm: a thin gel holding a single layer of peptidoglycan, tied to the outer membrane by lipoprotein. Then the inner membrane, where the cell makes its ATP, since bacteria have no mitochondria.' },
  'real-motor': { name: 'Flagellar motor (realistic)', scale: '~45 nm across', real: 'motor', page: 'prokaryote_cell_realistic.html', hi: 'flag', children: ['flagellum', 'plasma-membrane', 'peptidoglycan'],
    tags: [['cring', 'C ring: switches the direction', 'flagellum', 'flag'], ['stator', 'Stator (MotA/MotB): protons flow through', null, 'flag'], ['ms', 'MS ring, in the inner membrane', null, 'flag'],
      ['rod', 'Drive rod', null, 'flag'], ['pring', 'P ring, in the wall', 'peptidoglycan', 'flag'], ['lring', 'L ring, in the outer membrane', null, 'flag'], ['hook', 'Hook: a flexible joint', 'flagellum', 'flag'], ['gate', 'Export gate: builds the filament', null, 'flag']],
    desc: 'A rotary motor about 45 nm across, cut through its middle. Protons flowing into the cell through a ring of stators push on the rotor, spinning it up to about 100 times a second (slowed right down here). Bushings carry the rod through the wall and the outer membrane; the hook then turns the axis toward the long helical filament. When the C ring switches direction the bundle flies apart and the cell tumbles.' },
  'real-pole': { name: 'Chemoreceptor array (realistic)', scale: '~250 nm across', real: 'pole', page: 'prokaryote_cell_realistic.html', hi: 'chemo', children: ['chemoreceptor', 'plasma-membrane'],
    tags: [['mcp', 'Receptor dimers, in trimers', 'chemoreceptor', 'chemo'], ['chea', 'CheA kinase and CheW', null, 'chemo'], ['peri', 'Sensing domains, in the periplasm', null, 'chemo'], ['im', 'Inner membrane', 'plasma-membrane', 'im']],
    desc: 'At one pole, thousands of receptors sit in a honeycomb, 12 nm from one trimer to the next. Outside they sense sugars, amino acids and repellents; inside, their tips hold the CheA kinase, whose signal tells the motors when to tumble. Packed together they act as one, which makes the cell very sensitive to small changes as it swims.' },
  'real-nucleoid': { legend: LEG_REAL, name: 'Nucleoid (realistic)', scale: '~1.2 × 0.65 µm', real: 'nucleoid', page: 'prokaryote_cell_realistic.html', hi: 'dna',
    children: ['dna', 'hu-protein', 'real-gene', 'rna-polymerase', 'rna', 'ribosome-70s', 'groel'],
    tags: [['dna', 'Plectoneme: DNA wound round itself', 'dna', 'dna'], ['hu', 'HU bending the DNA', 'hu-protein', 'hu'], ['rrn', 'rRNA gene read by many polymerases', null, 'rnap'], ['gene', 'Gene being read and translated', 'real-gene', 'mrna'],
      ['rnap', 'RNA polymerase, waiting', 'rna-polymerase', 'rnap'], ['mrna', 'mRNA', 'rna', 'mrna'], ['ribosome', 'Ribosome', 'ribosome-70s', 'ribosome'], ['cyto', 'GroEL chaperonin', 'groel', 'cyto']],
    desc: 'The chromosome without a nucleus: one circle of 4.6 million base pairs, 1.6 mm long, folded into a region about a micrometre across. Negative supercoiling winds it into plectonemes, two stretches of double helix wrapped round each other, in loops of about 10,000 base pairs; proteins such as HU bend and bridge it. Ribosomes are mostly kept out, so they crowd round its edge. All 4.6 million base pairs are folded here; they are drawn one by one near the cut, and wherever you zoom in.' },
  'real-gene': { legend: LEG_REAL, name: 'Gene being read (realistic)', scale: '~100 nm across', real: 'gene', page: 'prokaryote_cell_realistic.html', hi: 'mrna',
    children: ['rnap-ecoli', 'rna', 'ribosome-ecoli', 'polypeptide', 'dna', 'hu-protein', 'protein'],
    tags: [['rnap', 'RNA polymerase', 'rnap-ecoli', 'rnap'], ['mrna', 'New mRNA', 'rna', 'mrna'], ['ribosome', 'Ribosome, already reading it', 'ribosome-ecoli', 'ribosome'], ['peptide', 'New protein chain', 'polypeptide', 'ribosome'],
      ['dna', 'DNA', 'dna', 'dna'], ['hu', 'HU', 'hu-protein', 'hu'], ['cyto', 'A cytoplasm protein', 'protein', 'cyto']],
    desc: 'Transcription and translation at once. With no nuclear envelope in the way, ribosomes climb onto an mRNA as soon as its 5′ end leaves RNA polymerase. The lead ribosome follows close behind the polymerase, and others load behind it, each with its growing protein chain. Everything here is a real structure at its true size, one bead per amino acid or nucleotide.' },
  'ribosome-ecoli': { name: 'Ribosome (E. coli 70S, real structure)', scale: '~25 nm', b: buildRiboEcoli, children: ['ribo-30s', 'ribo-50s', 'rna', 'protein'],
    desc: 'The real E. coli ribosome (PDB 4YBB), a bead for every nucleotide and amino acid: about 4,500 nucleotides of rRNA in three molecules (16S, 23S and 5S) and over 50 proteins. The small 30S subunit (paler) reads the mRNA; the large 50S subunit (darker) joins the amino acids. A fast-growing cell holds tens of thousands.' },
  'rnap-ecoli': { name: 'RNA polymerase (E. coli, real structure)', scale: '~15 nm', b: buildRnapEcoli, children: ['polypeptide', 'alpha-helix', 'amino-acid'],
    desc: 'The bacterial RNA polymerase holoenzyme (PDB 4YG2). Two α subunits, β, β′ and ω make up the core that builds RNA; σ70 rides along to find where genes start, and lets go once the polymerase is under way. The β and β′ pincers clamp the DNA, and the active site sits deep between them.' },
  'groel': { name: 'GroEL–GroES chaperonin (real structure)', scale: '~14 nm wide, 20 nm tall', b: buildGroEL, children: ['polypeptide', 'alpha-helix', 'amino-acid'],
    desc: 'A protein-folding machine (PDB 1AON): two rings of seven GroEL proteins and a lid of seven GroES. A newly made protein that misfolds is caught inside one ring, capped, and given about ten seconds in a sheltered chamber to fold, paid for with ATP.' },
  'hu-protein': { name: 'HU (nucleoid protein, real structure)', scale: '~3 nm body', b: buildHU, children: ['polypeptide', 'alpha-helix', 'amino-acid'],
