// 7 · Stardust: the molecule drawn as glowing particles, like a nebula
STYLES.push({ name: 'Stardust', desc: 'Thousands of glowing particles tracing the molecule like a nebula', bloom: [1.1, .7, 0], tone: THREE.NoToneMapping,
  bg: (g, s) => { radial('#2a1650', '#100a26', '#04030c')(g, s); for (let i = 0; i < 500; i++) { g.fillStyle = `rgba(255,255,255,${rand() * .7})`; const r = rand() * 1.4; g.beginPath(); g.arc(rand() * s, rand() * s, r, 0, 7); g.fill(); } },
  build(g) {
    const pos = [], cols = [], add = (p, c, n, spread) => { const col = new THREE.Color(c); for (let i = 0; i < n; i++) { pos.push(p.x + (rand() - .5) * spread, p.y + (rand() - .5) * spread, p.z + (rand() - .5) * spread); cols.push(col.r, col.g, col.b); } };
    const sc = { T: '#6fe7ff', C: '#ffb36b', R: '#ff6bf0' }, bc = { A: '#ff6b8a', T: '#6b9dff', G: '#7dffb0', C: '#ffe46b', U: '#d08cff' };
    strands.forEach(({ pts, k }) => { const c = curve(pts); for (let i = 0; i < pts.length * 60; i++) add(c.getPointAt(i / (pts.length * 60)), sc[k], 1, .3); });
    eachHalf((a, b, base) => { for (let i = 0; i < 24; i++) add(a.clone().lerp(b, i / 24), bc[base], 1, .12); });
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
    const dot = paint((c, s) => { const gr = c.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.3, 'rgba(255,255,255,.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = gr; c.fillRect(0, 0, s, s); });
    g.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: .09, vertexColors: true, map: dot, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })));
  } });

// 8 · Infographic: flat colour, letter-labelled bases, a clean poster look
const letter = (ch, col) => { const t = paint((c, s) => { c.fillStyle = col; c.beginPath(); c.arc(s / 2, s / 2, s * .46, 0, 7); c.fill(); c.fillStyle = '#ffffff'; c.font = `800 ${s * .56}px system-ui, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(ch, s / 2, s / 2 + s * .03); }); const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t })); return sp; };
STYLES.push({ name: 'Infographic', desc: 'Flat poster colours with every base labelled A, T, G, C, U', cam: 'ortho', tone: THREE.NoToneMapping,
  bg: (g, s) => { g.fillStyle = '#fbfaf6'; g.fillRect(0, 0, s, s); g.fillStyle = '#ffe9e0'; g.beginPath(); g.arc(s * .82, s * .2, s * .26, 0, 7); g.fill(); g.fillStyle = '#e4f1ff'; g.beginPath(); g.arc(s * .12, s * .85, s * .3, 0, 7); g.fill(); },
  build(g) {
    const col = { T: '#1f3b73', C: '#1f3b73', R: '#d93a7a' }, bc = { A: '#ff5c5c', T: '#3d8bff', G: '#2fbf71', C: '#ffb020', U: '#9b5cff' };
    strands.forEach(({ pts, k }) => g.add(new THREE.Mesh(new THREE.TubeGeometry(curve(pts), pts.length * 8, .17, 10), new THREE.MeshBasicMaterial({ color: col[k] }))));
    let i = 0; eachHalf((a, b, base) => { g.add(new THREE.Mesh(new THREE.TubeGeometry(curve([a, b]), 2, .1, 8), new THREE.MeshBasicMaterial({ color: bc[base] }))); if (i++ % 3 === 0) { const sp = letter(base, bc[base]); sp.position.copy(b.clone().lerp(a, .2)); sp.scale.setScalar(.42); g.add(sp); } });
  },
  after(g, s) { g.fillStyle = '#1f3b73'; g.font = '800 40px system-ui, sans-serif'; g.fillText('DNA → RNA', 40, 70); g.font = '500 22px system-ui, sans-serif'; g.fillStyle = '#5a6478'; g.fillText('Transcription: one strand is copied', 40, 104);
    [['A', '#ff5c5c'], ['T', '#3d8bff'], ['G', '#2fbf71'], ['C', '#ffb020'], ['U', '#9b5cff']].forEach(([ch, c], i) => { g.fillStyle = c; g.beginPath(); g.arc(56 + i * 58, s - 56, 22, 0, 7); g.fill(); g.fillStyle = '#fff'; g.font = '800 24px system-ui'; g.textAlign = 'center'; g.fillText(ch, 56 + i * 58, s - 48); g.textAlign = 'left'; }); } });

// 9 · Cryo-EM density: a smooth isosurface, as if reconstructed from an electron microscope
STYLES.push({ name: 'Cryo-EM density', desc: 'Smooth density map, like an electron-microscope reconstruction', bg: radial('#2c2a26', '#141311', '#060605'), exposure: 1.1,
  build(g, s) {
    s.add(new THREE.HemisphereLight('#fff6e8', '#2a2620', .7)); const k = new THREE.DirectionalLight('#ffe9c8', 3); k.position.set(-6, 7, 8); s.add(k); const r = new THREE.DirectionalLight('#9ec4ff', 1.4); r.position.set(8, -3, -5); s.add(r);
    const box = 16, mk = (color, rough) => { const m = new MarchingCubes(112, new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: .05 }), false, false, 300000); m.scale.setScalar(box / 2); m.isolation = 60; g.add(m); return m; };
    const dna = mk('#cfc6b0', .55), rna = mk('#d68fb4', .45), to = p => [p.x / box + .5, (p.y - .8) / box + .5, p.z / box + .5];
    strands.forEach(({ pts, k }) => { const c = curve(pts), n = pts.length * 3; for (let i = 0; i <= n; i++) { const [x, y, z] = to(c.getPointAt(i / n)); (k === 'R' ? rna : dna).addBall(x, y, z, .03, 12); } });
    eachHalf((a, b, base, isR) => { for (let j = 1; j <= 3; j++) { const [x, y, z] = to(a.clone().lerp(b, j / 3.2)); (isR ? rna : dna).addBall(x, y, z, .013, 12); } });
    dna.update(); rna.update();
  } });

// 10 · Gold and gems: polished gold backbones set with jewel-cut bases
STYLES.push({ name: 'Gold & gems', desc: 'Polished gold backbones set with jewel-cut bases', env: true, bloom: [.35, .4, .82], exposure: 1.05, bg: radial('#3a1426', '#1a0812', '#070205'),
  build(g, s) {
    const d = new THREE.DirectionalLight('#fff4e0', 2); d.position.set(5, 8, 10); s.add(d);
    const gold = new THREE.MeshPhysicalMaterial({ color: '#f2c14e', metalness: 1, roughness: .18, clearcoat: .5 }), rose = new THREE.MeshPhysicalMaterial({ color: '#f0a08c', metalness: 1, roughness: .22 });
    strands.forEach(({ pts, k }) => { g.add(new THREE.Mesh(new THREE.TubeGeometry(curve(pts), pts.length * 8, .15, 16), k === 'R' ? rose : gold)); pts.forEach(p => { const b = new THREE.Mesh(sph, k === 'R' ? rose : gold); b.position.copy(p); b.scale.setScalar(.22); g.add(b); }); });
    const gem = c => new THREE.MeshPhysicalMaterial({ color: c, metalness: 0, roughness: .05, transmission: .6, thickness: .6, ior: 2.1, clearcoat: 1, envMapIntensity: 2.2 }), gc = { A: '#ff2a55', T: '#2f6bff', G: '#18d47a', C: '#ffc21a', U: '#c45cff' }, oct = new THREE.OctahedronGeometry(1, 0);
    eachHalf((a, b, base) => { g.add(new THREE.Mesh(new THREE.TubeGeometry(curve([a, b]), 2, .035, 8), gold)); const m = new THREE.Mesh(oct, gem(gc[base])); m.position.copy(a.clone().lerp(b, .62)); m.scale.set(.15, .2, .15); m.lookAt(b); g.add(m); });
  } });

// ---------------------------------------------------------------------
// Render each style, then lay out a captioned comparison sheet
// ---------------------------------------------------------------------
const tiles = STYLES.map(st => shoot({ ...st }));
const cols = 5, tw = 600, cap = 118, out = document.getElementById('out'), og = out.getContext('2d');
out.width = cols * tw; out.height = Math.ceil(tiles.length / cols) * (tw + cap);
og.fillStyle = '#101114'; og.fillRect(0, 0, out.width, out.height);
tiles.forEach((t, i) => {
  const x = (i % cols) * tw, y = Math.floor(i / cols) * (tw + cap);
  og.drawImage(t, x, y, tw, tw);
  og.fillStyle = '#e8e8ea'; og.font = '700 30px system-ui, sans-serif'; og.fillText(`${i + 1}  ${STYLES[i].name}`, x + 24, y + tw + 46);
  og.fillStyle = '#9aa0aa'; og.font = '400 20px system-ui, sans-serif'; og.fillText(STYLES[i].desc, x + 24, y + tw + 84);
});
window.__dna = { tiles, out, STYLES };
document.getElementById('status').textContent = 'Done';
</script>
