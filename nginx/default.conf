server {
    listen 8080;
    server_name learn.bexonia.com _;

    root /usr/share/nginx/html;
    index cell_explorer.html index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/html text/css application/json application/javascript text/javascript image/svg+xml;

    location = /api/health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"bexonia-learn"}';
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /robots.txt {
        etag on;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        etag on;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location /screenshots/ {
        etag on;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location /dist/ {
        etag on;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    location / {
        etag on;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /cell_explorer.html;
    }
}
