let SITES = null;   // where the genes being read, the exporting pores, the fibrillar centres and other landmarks are (for scripted checks and the explorer's tags)
function buildNucleusInterior(pores) {
  SITES = { genes: [], pores: [], fcs: [], nucs: [], cc: [], read: [], mrnps: [], pol1: [], trees: [], preribo: [], pcna: [], ubiq: [] };
  const CH = balls('chromatin'), MR = balls('mrna'), RR = balls('rrna'), NL = balls('nucleolus'), NP = balls('nucleoplasm');
  const polCol = ['#7fffd0', '#a6f0e0', '#c38cff', '#9fe6ff', '#d6b0ff'].map(c => [col(c), col(new THREE.Color(c).offsetHSL(0, 0, .08).getStyle())]);   // RNA polymerase II, a shade per chain
  const inside = (q, m) => nucGap(q) < -m, wedge = q => q.x > 0 && q.z > 0, nuc = () => N0.clone().add(V(rr(-NA, NA), rr(-NB, NB), rr(-NC, NC)));
  const depth = q => q.z > 0 ? -q.x : q.x > 0 ? -q.z : 9;   // how far behind the nearest cut face a point lies

  // ---- 10 chromosomes, two of each of the five of Arabidopsis thaliana (the plant biologists study most; Mb), each a single DNA molecule
  //      folded into its own territory
  const MB = [30.4, 19.7, 23.5, 18.6, 27].flatMap(s => [s, s]).sort((a, b) => b - a);
  const perMb = 1100 / MB.reduce((a, b) => a + b), centres = [], ok = q => inside(q, .28) && q.distanceTo(NO) > NOR + .2 && gFree(q, NUC_R);
  MB.forEach(mb => {
    const n = Math.round(mb * perMb), R = .23 * Math.cbrt(n);
    let best = null, bd = -1;
    for (let t = 0; t < 60; t++) { const q = nuc(); if (!inside(q, Math.min(.9, R * .5)) || q.distanceTo(NO) < NOR + .3) continue; const d = centres.reduce((m, c) => Math.min(m, c.distanceTo(q)), 9); if (d > bd) { bd = d; best = q; } }
    if (!best) return;
    centres.push(best);
    // its centromere and the repeats round it pack tight into a chromocenter at the edge of the nucleus, a hallmark of plant nuclei; the
    // arms loop out from it into the territory
    const dc = best.clone().sub(N0).normalize(), ccP = N0.clone().addScaledVector(dc, nucR(dc) - .42), C0 = fold(ccP, .3, Math.round(n * .22), ok);
    let from = null; if (C0.length) for (let t = 0; t < 200 && !from; t++) { const q = C0.at(-1).clone().add(randDir().multiplyScalar(rr(.3, .6))); if (ok(q)) from = q; }   // a free spot just outside it
    const C1 = fold(best, R, n - C0.length, ok, from), C = [...C0, ...C1], open = new Set(); SITES.nucs.push(...C1); if (C0.length > 5) SITES.cc.push(ccP); SITES.ccn = (SITES.ccn ?? 0) + C0.length;
    // about a third of the chromosomes have a gene being read, picked just behind a cut face where possible so it can be seen:
    // three nucleosomes are cleared and RNA polymerase II sits on the bare DNA
    let g = -1;
    if (C.length > 30 && rand() < .8) { let bd = 9; for (let j = C0.length + 6; j < C.length - 10; j++) { const d = depth(C[j + 1]), sc = d < .06 ? 9 : Math.abs(d - .15) + rand() * .1; if (sc < bd) { bd = sc; g = j; } } }
    if (g > 0) open.add(g).add(g + 1).add(g + 2);
    const ax = chromosome(CH, C, open, C0.length);
    if (!open.size) return;
    let bi = 0; ax.forEach((x, i) => { if (x.distanceToSquared(C[g + 1]) < ax[bi].distanceToSquared(C[g + 1])) bi = i; });
    // the new mRNA grows out along the nearest cut face, beside the polymerase as seen from in front of the face
    const at = ax[bi], along = ax[Math.min(ax.length - 1, bi + 4)].clone().sub(ax[Math.max(0, bi - 4)]).normalize(), fn = at.z > 0 ? V(1, 0, 0) : V(0, 0, 1);
    const up = across(across(randDir(), fn).addScaledVector(fn, -.04), along); SITES.genes.push(at);
    placeProtein(MR, 'polII', at, turn(), (ch, part) => polCol[ch % polCol.length][part === 1 ? 1 : 0]);   // the real RNA polymerase II (PDB 1I50), the DNA running through it
    const rna = rnaFold(MR, at.clone().addScaledVector(up, .17), up, Math.floor(rr(70, 190)), MRNA, { pull: up, pullW: 1, hairpin: .02 });
    rna.forEach((x, i) => { if (i % 18 === 9) MR.add(x.clone().add(randDir().multiplyScalar(.022)), rr(.04, .05), col('#8fd3ff')); });   // RNA-binding proteins join as it grows
    clump(MR, rna.at(-1), .02, 3, ['#ffd24f'], .03, .04);   // the cap-binding complex on the 5′ end
    SITES.read.push({ at, rna, dna: ax.slice(Math.max(0, bi - 300), bi + 300) });
  });

  // ---- finished mRNAs, wrapped in proteins, in the spaces between the chromosomes
  for (let i = 0, made = 0; i < 600 && made < 16; i++) {
    const c = nuc(); if (wedge(c) || !inside(c, .4) || c.distanceTo(NO) < NOR + .3 || !gFree(c, .12)) continue;
    made++;
    const rna = rnaFold(MR, c, randDir(), Math.floor(rr(140, 260)), MRNA, { home: c, rad: .07, hairpin: .03 });
    rna.forEach((x, k) => { if (k % 16 === 8) MR.add(x.clone().add(randDir().multiplyScalar(.02)), rr(.035, .05), col(k % 3 ? '#8fd3ff' : '#7dffb0')); });
    clump(MR, rna[0], .02, 3, ['#ffd24f'], .03, .04); clump(MR, rna.at(-1), .025, 4, ['#ffb0d0'], .03, .042);   // the cap on one end, poly(A)-binding proteins on the other
    gAdd(c, .11); SITES.mrnps.push(c);
  }
  // ---- mRNAs leaving through pores beside the cut, cap first
  const nearCut = (p, a, b) => p.y - N0.y > -1.5 && p.y - N0.y < 1.7 && p[a] < -.06 && p[a] > -.45 && p[b] > .8;
  [...pores.filter(({ p }) => nearCut(p, 'x', 'z')).slice(0, 4), ...pores.filter(({ p }) => nearCut(p, 'z', 'x')).slice(0, 4)].forEach(({ p, d }) => {
    SITES.pores.push({ p, d });
    const s = across(randDir(), d), pts = [-.6, -.3, -.12, 0, .14, .36].map((k, i) => p.clone().addScaledVector(d, k).addScaledVector(s, i === 0 || i === 5 ? rr(-.16, .16) : 0));
    const ax = resample(new THREE.CatmullRomCurve3(pts).getSpacedPoints(120), NT); rnaAlong(MR, ax, MRNA);
    clump(MR, ax.at(-1), .02, 3, ['#ffd24f'], .03, .04); clump(MR, ax[Math.floor(ax.length * .35)], .02, 2, ['#7dffb0'], .035, .045);   // the cap leads; an export receptor rides along
  });

  // ---- the nucleolus, sliced open by the cut. Pale fibrillar centres hold loops of rDNA; a row of RNA polymerase I reads each gene, and their
  //      rRNA transcripts lengthen along it (a "Christmas tree"), folding as they grow out into the dense fibrillar shell where they are processed.
  //      The granular part around is packed with pre-ribosomes: folded rRNA with ribosomal proteins.
  const nl = new THREE.Mesh(blobGeo(NOR, .12, 2.4, 5), reg('nucleolus', phys({ color: '#c94f7c', roughness: .65, sheen: .5, sheenColor: '#ffc4d8', side: THREE.DoubleSide })));
  nl.position.copy(NO); cell.add(shade(nl));
  const fcs = [], fcMat = reg('nucleolus', phys({ color: '#ffe3ee', roughness: .8, transparent: true, opacity: .35, depthWrite: false, side: THREE.DoubleSide }));
  for (let t = 0; t < 500 && fcs.length < 7; t++) {
    const c = NO.clone().add(V(fcs.length < 5 ? rr(-.26, .02) : rr(-.75, -.4), rr(-.62, .62), rr(-.62, .62))), r = rr(.13, .18);
    if (c.distanceTo(NO) > .66 || fcs.some(f => f.c.distanceTo(c) < f.r + r + .34)) continue;
    fcs.push({ c, r });
  }
  fcs.forEach(({ c, r }) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r * .92, 32, 20), fcMat); m.position.copy(c); cell.add(m); SITES.fcs.push({ c, r });
    for (let k = 0; k < 70; k++) NL.add(c.clone().addScaledVector(randDir(), r * .85 * Math.cbrt(rand())), rr(.018, .026), col('#ffd9e6'));   // UBF and the other proteins that hold the rDNA open
    const ax = randDir(), u = across(randDir(), ax), w = ax.clone().cross(u), k0 = rr(0, 6.283), loop = [];
    for (let i = 0; i <= 160; i++) { const a = i / 160 * Math.PI * 2, rad = r * (1.05 + .08 * Math.sin(a * 3 + k0)); loop.push(c.clone().addScaledVector(u, rad * Math.cos(a)).addScaledVector(w, rad * Math.sin(a)).addScaledVector(ax, .03 * Math.sin(a * 2 + k0))); }
    const dna = resample(loop, BP); emitDNA(CH, dna);
    for (let j = 0; j < 11; j++) {   // the gene takes most of the loop; the rest is spacer
      const at = dna[Math.floor((j + .5) / 11 * .75 * dna.length)], out = at.clone().sub(c).normalize();
      clump(NL, at.clone().addScaledVector(out, .02), .022, 4, POL, .04, .05); if (j === 6) SITES.pol1.push(at);
      const rna = rnaFold(RR, at.clone().addScaledVector(out, .05), out, 12 + j * 16, RRNA, { pull: out, pullW: 1.1, hairpin: .06 });
      if (j > 2) clump(NL, rna.at(-1), .02 + j * .002, 4 + j, ['#ffd37a', '#ffe8a8'], .03, .042);   // the terminal knob: a processome assembling on the 5′ end
      if (j === 9) SITES.trees.push(rna[Math.floor(rna.length / 2)]);
    }
    for (let k = 0; k < 150; k++) NL.add(c.clone().addScaledVector(randDir(), r + rr(.05, .22)), rr(.018, .026), col(rand() < .6 ? '#b8306a' : '#d9487f'));   // processing proteins (fibrillarin and its snoRNAs)
  });
  for (let i = 0, made = 0; i < 16000 && made < 1300; i++) {
    const p = NO.clone().addScaledVector(randDir(), NOR * Math.cbrt(rand()));
    if (wedge(p) || fcs.some(f => f.c.distanceTo(p) < f.r + .32) || !gFree(p, .045)) continue;
    made++; gAdd(p, .045); SITES.preribo.push(p);
    rnaFold(RR, p, randDir(), Math.floor(rr(50, 80)), RRNA, { home: p, rad: .022, hairpin: .09 });
    clump(NL, p, .035, 6, ['#e9b3cf', '#d7a1e6', '#f4cfa8'], .022, .03);   // ribosomal proteins
  }

  // ---- soluble proteins of the nucleoplasm
  // real proteins: PCNA clamps (PDB 1AXC), which hold DNA while it is copied, and ubiquitin (1UBQ), the tag that sends proteins to be recycled
  const pcnaCol = ['#e98bb0', '#d672a0', '#f2a6c4'].map(c => [col(c), col(new THREE.Color(c).offsetHSL(0, 0, .08).getStyle())]), ubCol = [col('#e8d26a'), col('#f4e49a')];
  for (let i = 0, made = 0; i < 4000 && made < 280; i++) {
    const p = N0.clone().add(randDir().multiplyScalar(rr(0, 3))); if (wedge(p) || !inside(p, .3) || p.distanceTo(NO) < NOR + .1) continue;
