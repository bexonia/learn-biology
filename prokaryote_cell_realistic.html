  .bar { width: 18px; height: 6px; border-radius: 3px; display: inline-block; }

  #flows h2 { margin: 2px 8px 4px; font-size: 13px; font-weight: 650; }
  .speed { display: flex; align-items: center; gap: 8px; margin: 2px 8px 8px; font-size: 12px; color: var(--muted); }
  .speed input { flex: 1; min-width: 0; accent-color: var(--accent); }
  #spd { width: 38px; text-align: right; color: var(--fg); font-variant-numeric: tabular-nums; }
  #tip { margin: 0 8px 8px; font-size: 12px; line-height: 1.45; color: var(--muted); }
  #tip b { color: var(--fg); font-weight: 600; }
  .mol { display: flex; align-items: center; gap: 8px; padding: 3px 8px; border-radius: 7px; font-size: 12.5px; cursor: default; }
  .mol:hover { background: rgba(159,216,255,.14); }
